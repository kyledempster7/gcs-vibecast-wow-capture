<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>TWE — Lower third</title>
  <style>
    html, body { margin:0; height:100%; background:transparent; overflow:hidden;
      font-family: system-ui, sans-serif; }
    .lt { position:absolute; left:6%; bottom:12%; display:flex; flex-direction:column; gap:4px; }
    .name { background:#8b1e2d; color:#f3e9d7; padding:10px 18px; font-size:22px; font-weight:700;
      border-left:4px solid #7ec8e3; }
    .line { background:#121826cc; color:#7ec8e3; padding:6px 18px; font-size:14px; letter-spacing:.04em; }
  </style>
</head>
<body>
  <div class="lt">
    <div class="name" data-slot="name">Kyle · Wrath brain</div>
    <div class="line" data-slot="line">Returner · Explorer’s League</div>
  </div>
</body>
</html>
