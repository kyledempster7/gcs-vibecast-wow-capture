<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>TWE — Explorer’s League stamp</title>
  <style>
    html, body { margin:0; height:100%; background:transparent; display:flex; align-items:center; justify-content:center; }
    .stamp { width:220px; height:220px; border-radius:50%; border:6px double #c9a227;
      background: radial-gradient(circle at 40% 35%, #3d5c45 0%, #0b0e14 70%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      color:#f3e9d7; font-family: Palatino, Georgia, serif; text-align:center;
      box-shadow: 0 0 0 3px #8b1e2d inset; }
    .stamp .top { font-size:12px; letter-spacing:.25em; color:#7ec8e3; text-transform:uppercase;
      font-family:system-ui,sans-serif; }
    .stamp .mid { font-size:22px; margin:8px 0; line-height:1.15; }
    .stamp .bot { font-size:11px; color:#a89b84; font-family:system-ui,sans-serif; }
  </style>
</head>
<body>
  <div class="stamp">
    <div class="top">Original</div>
    <div class="mid">Explorer’s<br/>League</div>
    <div class="bot">not Blizzard chrome</div>
  </div>
</body>
</html>
